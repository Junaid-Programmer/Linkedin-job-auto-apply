# =====================================================================
# JOB AGENT RULES
# ---------------------------------------------------------------------
# Edit this file to control which jobs the agent keeps. Rules here are
# HARD FILTERS: a job that fails any rule is marked SKIPPED in the sheet
# and never scored or tailored.
#
# How to edit:
#   - keep the two-space indentation under each heading
#   - lists start with "- "
#   - text is case-insensitive
#   - anything after a # on a line is a comment (ignored)
#   - empty list = rule is off
# =====================================================================

# ---------------------------------------------------------------------
# 1) WHERE THE JOB MUST BE (region gate)
# ---------------------------------------------------------------------
# `linkedin_location` is the place sent to LinkedIn's search box. It can
# be a country, city, region ("Europe"), or a country you name.
linkedin_location: Europe

# A job is kept only if its location (shown on LinkedIn) is in one of
# these countries. This list = EU-27 + Iceland, Norway, Switzerland,
# United Kingdom. Empty list = no region filter.
allow_countries:
  - Austria
  - Belgium
  - Bulgaria
  - Croatia
  - Cyprus
  - Czechia
  - Denmark
  - Estonia
  - Finland
  - France
  - Germany
  - Greece
  - Hungary
  - Iceland
  - Ireland
  - Italy
  - Latvia
  - Lithuania
  - Luxembourg
  - Malta
  - Netherlands
  - Norway
  - Poland
  - Portugal
  - Romania
  - Slovakia
  - Slovenia
  - Spain
  - Sweden
  - Switzerland
  - United Kingdom

# Remote postings often show only "Remote" without a country. If you are
# open to remote jobs posted by EU employers, keep this true. Set false
# to reject any posting whose location is just "Remote".
allow_remote_unknown: true

# ---------------------------------------------------------------------
# 2) COMPANIES (blocklist)
# ---------------------------------------------------------------------
# Job is rejected if its company name contains any of these (partial,
# case-insensitive match). Example:
#   excluded_companies:
#     - ABC Consulting
#     - spam-staffing
excluded_companies: []

# ---------------------------------------------------------------------
# 3) KEYWORDS IN THE POSTING (required/forbidden)
# ---------------------------------------------------------------------
# `required_keywords`: the job MUST contain ALL of these somewhere in the
# title or description. Example to require entry/junior-friendly roles:
#   required_keywords:
#     - entry level
#     - junior
required_keywords: []

# `excluded_keywords`: the job is REJECTED if the title or description
# contains ANY of these.
excluded_keywords:
  - commission-based
  - commission based
  - door to door
  - night shift
  - telemarketing
  - 1099
  - unpaid
  - internship

# ---------------------------------------------------------------------
# 4) WORK STYLE (remote / hybrid / on-site)
# ---------------------------------------------------------------------
# any | remote | remote only | on-site | on-site only | hybrid | hybrid only
work_style: remote

# ---------------------------------------------------------------------
# 5) EMPLOYMENT TYPE & LEVEL (optional, checked in the description)
# ---------------------------------------------------------------------
# If you only want full-time, permanent jobs:
#   employment_keywords:
#     - full-time
#     - permanent
employment_keywords: []

# Seniority keywords. Leave empty for any level. Example for entry/junior:
#   level_keywords:
#     - entry level
#     - junior
#     - fresher
level_keywords: []

# ---------------------------------------------------------------------
# 6) EXTRA WORDS THAT RAISE A MATCH SCORE (optional)
# ---------------------------------------------------------------------
# The offline scorer gives extra credit when these appear. Useful for
# skills or tools you love that your profile may not spell out.
preferred_keywords: []

# ---------------------------------------------------------------------
# 7) APPLICANTS ALREADY SUBMITTED (optional)
# ---------------------------------------------------------------------
# Skip jobs based on LinkedIn's "X applicants" insight.
# 0 = unused. Unknown counts are skipped only when a bound is set.
# Example: max_applicants: 50  skips jobs that already have 50+ applicants.
min_applicants: 0
max_applicants: 0

# ---------------------------------------------------------------------
# 8) HOW RECENTLY THE JOB WAS POSTED
# ---------------------------------------------------------------------
# Keep jobs posted within this window. Also used as the LinkedIn search
# time filter. LinkedIn only has 24h / week / month / any in search, so
# 2h, 5h, 7h, and 2day are tightened locally from the Posted text.
# Values: 2h | 5h | 7h | 24h | 2day | 7day | all
posted_within: 24h
